<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090b"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>Fahrschule 2.0</title>
<style>
:root{--bg:#07090b;--g:#7cff4a;--g2:#b6ff7a;--gd:#3f9a22;--t:#eef3ee;--m:#8b9a8f;--line:rgba(255,255,255,.08);--glass:rgba(255,255,255,.045);--r:#ff5a4d;--o:#ffb020;--b:#3b8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--t);font:16px/1.45 -apple-system,"SF Pro Display",system-ui,Roboto,sans-serif;padding-bottom:92px;background:radial-gradient(900px 500px at 50% -120px,rgba(124,255,74,.10),transparent 60%),var(--bg);min-height:100vh}
main{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 16px}
h1{font-size:26px;margin:6px 0 4px;letter-spacing:-.02em}h2{font-size:12px;margin:26px 0 10px;color:var(--m);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-weight:900;letter-spacing:.12em;font-size:13px;color:var(--g)}.logo b{color:var(--t)}
.chips{display:flex;gap:8px}.chip{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;backdrop-filter:blur(12px)}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:16px;background:linear-gradient(180deg,var(--g2),var(--g));color:#052008;font-weight:800;font-size:16px;margin:10px 0;letter-spacing:.01em;box-shadow:0 8px 24px rgba(124,255,74,.25)}
.btn:active{transform:scale(.98)}.btn.alt{background:var(--glass);color:var(--t);border:1px solid var(--line);box-shadow:none}.btn:disabled{opacity:.35;box-shadow:none}
.row{display:flex;gap:12px;align-items:center}.sp{justify-content:space-between}.m{color:var(--m);font-size:13px}.big{font-size:36px;font-weight:900;letter-spacing:-.02em}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gd),var(--g2));border-radius:9px;transition:width .6s}
.stage{position:relative;border-radius:24px;overflow:hidden;padding:26px 12px 14px;background:radial-gradient(ellipse 80% 55% at 50% 78%,rgba(124,255,74,.22),transparent 70%),linear-gradient(180deg,#0e1511,#070a08);border:1px solid var(--line)}
.stage:before{content:"";position:absolute;left:-20%;right:-20%;bottom:-6px;height:46%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 38px),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 22px);transform:perspective(220px) rotateX(58deg);transform-origin:bottom;mask-image:linear-gradient(0deg,#000,transparent)}
.stage svg{position:relative;filter:drop-shadow(0 14px 24px rgba(0,0,0,.6))}
.tag{position:absolute;top:12px;left:14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--m)}
.hud{position:absolute;right:12px;top:10px;text-align:right}.hud b{display:block;font-size:20px;line-height:1.05;color:var(--g2)}.hud span{font-size:10px;letter-spacing:.12em;color:var(--m);text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;color:var(--t);font-size:15px;font-weight:700;display:flex;flex-direction:column;gap:4px}
.tile small{font-weight:400;color:var(--m);font-size:12px}.tile.hot{background:linear-gradient(160deg,rgba(124,255,74,.2),rgba(124,255,74,.04));border-color:rgba(124,255,74,.35)}
.topic{display:flex;gap:14px;align-items:center;padding:12px 14px;background:var(--glass);border:1px solid var(--line);border-radius:18px;margin:8px 0}
.topic b{font-size:15px}.topic .m{margin-top:2px}.ring{flex:none}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(9,12,10,.82);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--m);padding:7px 0 5px;font-size:10.5px;font-weight:600;letter-spacing:.04em;position:relative}
nav button svg{width:24px;height:24px;display:block;margin:0 auto 3px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--g)}nav button.on:after{content:"";position:absolute;top:-6px;left:30%;right:30%;height:2px;background:var(--g);border-radius:2px;box-shadow:0 0 10px var(--g)}
.qhead{display:flex;gap:4px;margin:6px 0 14px}.qhead i{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.1)}.qhead i.d{background:var(--g)}.qhead i.x{background:var(--r)}.qhead i.c{background:rgba(124,255,74,.45)}
.qimg{max-width:230px;margin:8px auto 14px;display:block}.qimg svg{width:100%;display:block}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;margin:9px 0;border-radius:16px;border:1.5px solid var(--line);background:var(--glass);color:var(--t);font-size:16px;transition:.15s}
.opt i{flex:none;width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;color:var(--m)}
.opt.sel{border-color:var(--g);background:rgba(124,255,74,.1)}.opt.sel i{background:var(--g);color:#052008}
.opt.good{border-color:var(--g);background:rgba(124,255,74,.16)}.opt.bad{border-color:var(--r);background:rgba(255,90,77,.14);animation:sh .35s}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ogrid .opt{justify-content:center;padding:10px;margin:0}.ogrid .opt i{display:none}.ogrid .opt svg{width:100%;max-width:96px}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.tip{border-left:3px solid var(--o);padding:10px 12px;margin:12px 0;color:#ffd58a;background:rgba(255,176,32,.08);border-radius:10px;font-size:14.5px}
.exp{margin:12px 0;padding:14px;border-radius:16px;background:rgba(255,255,255,.05);font-size:15px}
.float{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-size:32px;font-weight:900;color:var(--g2);text-shadow:0 0 20px rgba(124,255,74,.7);animation:fl 1.1s ease-out forwards;z-index:9;pointer-events:none}
@keyframes fl{to{transform:translate(-50%,-90px);opacity:0}}
.toast{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--g);color:#052008;padding:10px 18px;border-radius:99px;font-weight:800;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.part{padding:13px;border-radius:16px;border:1px solid var(--line);background:var(--glass);display:flex;flex-direction:column}
.part.own{border-color:rgba(124,255,74,.5);background:rgba(124,255,74,.07)}.part.lock{opacity:.5}.part b{font-size:14px}.part small{color:var(--m);display:block;font-size:12px;margin-top:2px}.part .eff{color:var(--g2);font-size:12px;margin-top:6px;font-weight:700}
.part button{margin-top:auto;padding:10px;border:0;border-radius:11px;background:var(--g);color:#052008;font-weight:800;margin-top:10px}.part button:disabled{background:rgba(255,255,255,.08);color:var(--m)}
.gauges{display:flex;justify-content:space-around;gap:6px}
.step{display:flex;gap:12px;padding:13px;border-radius:14px;border:1.5px solid var(--line);margin:7px 0;background:var(--glass);width:100%;color:var(--t);text-align:left;font-size:15px}
.step span{color:var(--g2);font-weight:900;min-width:22px}.step.done{border-color:var(--g);background:rgba(124,255,74,.12)}.step.err{animation:sh .3s;border-color:var(--r)}
.mission{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.mission:last-child{border:0}.mission .bar{margin-top:6px}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}.ck.on{background:var(--g);border-color:var(--g);color:#052008}
input,select{background:rgba(255,255,255,.06);color:var(--t);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:16px;max-width:100%}
@keyframes eq{to{transform:scaleY(.35)}}.pump{filter:brightness(1.4)}svg.beat{animation:bt .43s ease-in-out infinite alternate}@keyframes bt{to{transform:scale(1.012)}}
.ver{font-size:10px;color:var(--m);font-weight:600;letter-spacing:.05em;margin-left:4px}.ph{aspect-ratio:3/2;border-radius:14px;background:rgba(255,255,255,.03)}.ph-tall{aspect-ratio:504/1024;max-height:68vh;margin:0 auto}
#app.qa>*{animation:fi .35s both}#app.qa>*:nth-child(2){animation-delay:.04s}#app.qa>*:nth-child(3){animation-delay:.08s}#app.qa>*:nth-child(4){animation-delay:.12s}#app.qa>*:nth-child(5){animation-delay:.16s}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cf{position:fixed;top:-14px;width:7px;height:11px;border-radius:2px;z-index:8;pointer-events:none;animation:cfall 1.6s ease-in forwards}@keyframes cfall{to{transform:translateY(108vh) rotate(720deg)}}
.qhead i{transition:background .3s}.chip b,.top .chip{transition:transform .2s}
.tw-spin{animation:tws 1s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes tws{to{transform:rotate(360deg)}}
.puff{animation:pf 1s ease-out forwards}@keyframes pf{from{opacity:.7;transform:translateX(0) scale(.5)}to{opacity:0;transform:translateX(-46px) scale(2)}}
.ach{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.ach div{aspect-ratio:1;border-radius:16px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;font-size:24px;text-align:center}.ach div.off{opacity:.25;filter:grayscale(1)}
.ach small{display:block;font-size:9px;color:var(--m);line-height:1.1;margin-top:2px}
input[type=range]{width:100%;accent-color:var(--g)}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;color:var(--m);padding:9px;border-radius:9px;font-weight:700}.seg button.on{background:var(--g);color:#052008}
</style></head><body><main id="app"></main><nav id="nav"></nav>
<script src="fragen.js"></script><script src="fragen2.js"></script><script src="gen.js"></script><script src="hazard.js"></script><script src="vendor/three.min.js"></script><script src="twingo3d.js"></script><script src="app.js"></script>
</body></html>
